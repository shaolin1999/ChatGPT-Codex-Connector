name: Build literature Markdown graph
on:
  push:
    branches: [material-notes-pages]
    paths:
      - 'public/literature-md/**'
      - 'public/graph-core.js'
      - 'scripts/build-literature-graph.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: material-notes-pages
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public graph index
        run: node scripts/build-literature-graph.cjs
      - name: Commit generated graph if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/literature-graph.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate literature Markdown graph index"
            git push
          fi
